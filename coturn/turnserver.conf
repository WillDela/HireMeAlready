# coturn TURN/STUN server. Runs with network_mode: host (see docker-compose.yml).
# The shared secret is passed on the command line from TURN_SECRET in the droplet's
# .env, and /api/turn-credentials signs short-lived credentials with it.

listening-port=3478
listening-ip=104.131.187.142
relay-ip=104.131.187.142
external-ip=104.131.187.142

# Relay port range; must match the ufw rule on the droplet.
min-port=49160
max-port=49200

realm=hiremealready.study
use-auth-secret
fingerprint

# No TLS yet (5349). If venue Wi-Fi blocks 3478, use the managed-TURN fallback in docs/PLAN.md.
no-tls
no-dtls
no-multicast-peers
no-software-attribute

# Never relay into private or internal networks (e.g. Docker's 172.x, the droplet's
# own services on 127.0.0.1, or DigitalOcean's metadata endpoint on 169.254.169.254).
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

log-file=stdout
simple-log
