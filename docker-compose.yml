# Production stack on the droplet. Only Caddy publishes ports: Docker-published ports
# bypass ufw, so every other service uses `expose` and is reached through Caddy.
#
# Stream A adds: `peer` (PeerJS signaling, expose 9000) and `coturn` (network_mode: host).

services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_PEER_HOST: ${NEXT_PUBLIC_PEER_HOST:-}
        NEXT_PUBLIC_PEER_PORT: ${NEXT_PUBLIC_PEER_PORT:-}
        NEXT_PUBLIC_PEER_PATH: ${NEXT_PUBLIC_PEER_PATH:-}
    env_file: .env
    restart: unless-stopped
    expose:
      - "3000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # TLS certificates; keep this volume or Caddy re-requests them
      - caddy_config:/config
    depends_on:
      - web

volumes:
  caddy_data:
  caddy_config:
