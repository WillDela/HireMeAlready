# Production stack on the droplet. Only Caddy publishes ports: Docker-published ports
# bypass ufw, so every other service uses `expose` and is reached through Caddy.

services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_PEER_HOST: ${NEXT_PUBLIC_PEER_HOST:-}
        NEXT_PUBLIC_PEER_PORT: ${NEXT_PUBLIC_PEER_PORT:-}
        NEXT_PUBLIC_PEER_PATH: ${NEXT_PUBLIC_PEER_PATH:-}
    env_file: .env
    restart: unless-stopped
    expose:
      - "3000"

  peer:
    build: ./peer-server
    restart: unless-stopped
    expose:
      - "9000"

  # Host networking: TURN needs the real public IP and a wide UDP port range, which
  # Docker's port publishing handles poorly. ufw applies to it normally.
  coturn:
    image: coturn/coturn:4.18.0
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    command:
      - -c
      - /etc/coturn/turnserver.conf
      - --static-auth-secret=${TURN_SECRET:?TURN_SECRET must be set in .env}

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # TLS certificates; keep this volume or Caddy re-requests them
      - caddy_config:/config
    depends_on:
      - web
      - peer

volumes:
  caddy_data:
  caddy_config:
